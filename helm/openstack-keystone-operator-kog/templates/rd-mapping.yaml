{{- if .Values.restdefinitions.mapping.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-mapping
  annotations:
    # The get must be able to answer "absent", or the create never runs (hack/validate-findby-identifiers.py).
    # A 404 declared in the OAS is documentation only; this is the vendor evidence that the get 404s.
    kog.openstack.krateo.io/get-absent-evidence: >-
      keystone stable/2026.1 keystone/api/os_federation.py MappingResource.get L303-315 calls federation_api.get_mapping; keystone/federation/backends/sql.py raises MappingNotFound (L331), a NotFound, so 404 when absent.
  labels:
    {{- include "openstack-keystone-operator-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-mapping/mapping.yaml
  resourceGroup: {{ .Values.restdefinitions.mapping.resourceGroup }}
  resource:
    # Federation mapping: client-chosen id (PUT), natural-key spec field `id`.
    kind: {{ .Values.restdefinitions.mapping.resourceKind }}
    identifiers:
      - id
    additionalStatusFields:
      - mapping.id
    verbsDescription:
      - action: create
        method: PUT
        path: /OS-FEDERATION/mappings/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: spec.id
      - action: get
        method: GET
        path: /OS-FEDERATION/mappings/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: spec.id
      - action: update
        # Keystone: PUT is create-only (409 if exists); update uses PATCH.
        method: PATCH
        path: /OS-FEDERATION/mappings/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: spec.id
      - action: delete
        method: DELETE
        path: /OS-FEDERATION/mappings/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: spec.id
{{- end }}
