{{- if .Values.restdefinitions.federation_protocol.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-federation-protocol
  annotations:
    # The get must be able to answer "absent", or the create never runs (hack/validate-findby-identifiers.py).
    # A 404 declared in the OAS is documentation only; this is the vendor evidence that the get 404s.
    kog.openstack.krateo.io/get-absent-evidence: >-
      keystone stable/2026.1 keystone/api/os_federation.py IDPProtocolsCRUDResource.get L245-252 calls federation_api.get_protocol; keystone/federation/backends/sql.py raises FederatedProtocolNotFound (L283), a NotFound, so 404 when absent.
  labels:
    {{- include "openstack-keystone-operator-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-federation-protocol/federationprotocol.yaml
  resourceGroup: {{ .Values.restdefinitions.federation_protocol.resourceGroup }}
  resource:
    # Federation protocol: composite client-chosen key {idp_id}+{id} (PUT).
    # Both are user-set natural-key spec fields (operation-level path params).
    kind: {{ .Values.restdefinitions.federation_protocol.resourceKind }}
    identifiers:
      - id
    additionalStatusFields:
      - protocol.id
    verbsDescription:
      - action: create
        method: PUT
        path: /OS-FEDERATION/identity_providers/{idp_id}/protocols/{id}
        requestFieldMapping:
          - inPath: idp_id
            inCustomResource: spec.idp_id
          - inPath: id
            inCustomResource: spec.id
      - action: get
        method: GET
        path: /OS-FEDERATION/identity_providers/{idp_id}/protocols/{id}
        requestFieldMapping:
          - inPath: idp_id
            inCustomResource: spec.idp_id
          - inPath: id
            inCustomResource: spec.id
      - action: update
        # Keystone: PUT is create-only (409 if exists); update uses PATCH.
        method: PATCH
        path: /OS-FEDERATION/identity_providers/{idp_id}/protocols/{id}
        requestFieldMapping:
          - inPath: idp_id
            inCustomResource: spec.idp_id
          - inPath: id
            inCustomResource: spec.id
      - action: delete
        method: DELETE
        path: /OS-FEDERATION/identity_providers/{idp_id}/protocols/{id}
        requestFieldMapping:
          - inPath: idp_id
            inCustomResource: spec.idp_id
          - inPath: id
            inCustomResource: spec.id
{{- end }}
