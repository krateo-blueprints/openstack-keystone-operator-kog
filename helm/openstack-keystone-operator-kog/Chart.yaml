apiVersion: v2
name: openstack-keystone-operator-kog
description: |
  Krateo Operator Generator (KOG) packaging that turns OpenStack Keystone
  identity resources (projects, users, roles, groups, domains, role
  assignments and application credentials) into native Kubernetes custom
  resources, driven by oasgen-provider + rest-dynamic-controller.
type: application
version: CHART_VERSION
# The Keystone release this chart is validated against (OpenStack-Helm keystone 2025.1), not the
# chart version: the chart version comes from the git tag.
appVersion: "2025.1"
keywords:
  - krateo
  - kog
  - oasgen-provider
  - openstack
  - keystone
  - identity
  - security
  - operator
home: https://github.com/krateo-blueprints/openstack-keystone-operator-kog
sources:
  - https://github.com/krateo-blueprints/openstack-keystone-operator-kog
maintainers:
  - name: krateo
icon: https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg
annotations:
  krateo.io/category: security
  krateo.io/display-name: OpenStack Keystone KOG
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
