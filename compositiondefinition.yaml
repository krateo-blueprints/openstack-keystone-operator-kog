# CompositionDefinition: registers this KOG chart as an installable Krateo Composition. The
# metadata.name is the Marketplace join key and must match the chart name in
# helm/openstack-keystone-operator-kog/Chart.yaml. CHART_VERSION is stamped from the release tag,
# and the release workflow also ships this file inside the chart archive.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: openstack-keystone-operator-kog
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/openstack-keystone-operator-kog
    version: CHART_VERSION
